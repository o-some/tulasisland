(()=>{const frame=document.getElementById('gameFrame');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const style=d.createElement('style');style.textContent=`.slot{overflow:hidden;white-space:nowrap;text-overflow:clip;font-size:1.05rem!important}.side{overflow:visible!important;contain:layout paint}.tula{transform-origin:50% 100%!important;will-change:transform,filter,opacity}.tula.react-ok{animation:wsTulaCorrect .68s cubic-bezier(.2,.8,.2,1) both!important}.tula.react-wrong{animation:wsTulaWrong .58s ease-out both!important}.bossSide{padding-top:54px!important;overflow:visible!important;align-items:flex-end!important}.bossImg{width:138px!important;max-width:160%!important;max-height:330px!important;object-fit:contain!important;object-position:center bottom!important;transform-origin:50% 100%!important;will-change:transform,filter}.bossPlate{top:4px!important;left:3px!important;right:-10px!important;z-index:12!important}.bossSide .bubble{top:74px!important;left:56px!important;right:auto!important;max-width:110px!important;z-index:13!important}.bossImg.react-hurt{animation:wsBossHurt .65s ease-out both!important}.bossImg.react-happy{animation:wsBossHappy .68s cubic-bezier(.2,.8,.2,1) both!important}.feedback,.bossFeedback{animation:wsPopup .25s ease-out both!important}@keyframes wsTulaCorrect{0%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.055) rotate(2deg);filter:brightness(1.15) saturate(1.12) drop-shadow(0 0 14px #ffe18a)}62%{transform:scale(1.025) rotate(-1deg)}100%{transform:scale(1);filter:brightness(1.04)}}@keyframes wsTulaWrong{0%{transform:scale(1)}28%{transform:scale(.985) rotate(-2deg);filter:brightness(.9) saturate(.82)}58%{transform:scale(.99) rotate(2deg)}100%{transform:scale(1);filter:brightness(.98)}}@keyframes wsBossHurt{0%{transform:scale(1)}22%{transform:translateY(-5px) scale(.97) rotate(-4deg);filter:brightness(.83) saturate(.75)}48%{transform:translateY(3px) scale(.965) rotate(3deg)}74%{transform:translateY(0) scale(.985) rotate(-2deg)}100%{transform:scale(1);filter:brightness(.96)}}@keyframes wsBossHappy{0%{transform:scale(1)}22%{transform:translateY(-9px) scale(1.05) rotate(4deg);filter:brightness(1.12) saturate(1.16)}48%{transform:translateY(0) scale(1.025) rotate(-3deg)}72%{transform:translateY(-6px) scale(1.04) rotate(2deg)}100%{transform:scale(1);filter:brightness(1.03)}}@keyframes wsPopup{from{opacity:0;transform:translateY(5px) scale(.96)}to{opacity:1;transform:none}}@media(max-width:430px){.game{grid-template-columns:minmax(0,1fr) 92px!important}.bossImg{width:124px!important;max-height:295px!important}.bossSide{padding-top:50px!important}.bossPlate{top:2px!important;font-size:.58rem!important}.bossSide .bubble{top:68px!important;left:48px!important;max-width:98px!important;font-size:.48rem!important}}@media(max-width:370px){.game{grid-template-columns:minmax(0,1fr) 82px!important}.bossImg{width:113px!important}.bossSide .bubble{left:43px!important;max-width:90px!important}}`;d.head.appendChild(style);const decorate=()=>{let st=null;try{st=w.eval('s')}catch(_){return}if(!st)return;d.querySelectorAll('.slot').forEach((el,i)=>{const item=st.sel?.[i];const letter=item&&typeof item==='object'?(item.l??item.letter??''):(item??'');el.textContent=letter;el.classList.toggle('filled',Boolean(letter));});const tula=d.querySelector('.tula');if(tula){tula.classList.remove('react-ok','react-wrong');if(st.feedback)tula.classList.add(st.feedback.ok?'react-ok':'react-wrong')}const boss=d.querySelector('.bossImg');if(boss){boss.classList.remove('react-hurt','react-happy');if(st.feedback)boss.classList.add(st.feedback.ok?'react-hurt':'react-happy')}};try{const originalRender=w.render;if(typeof originalRender==='function'){w.render=function(){originalRender();requestAnimationFrame(decorate)}}}catch(_){}decorate()})})();
</script>
