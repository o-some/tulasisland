<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#031e35" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Word Scramble · Tula's Island</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#031e35;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#031e35}
  </style>
</head>
<body>
<iframe id="gameFrame" title="Word Scramble" allow="fullscreen; autoplay"></iframe>
<script>
(()=>{
  const frame=document.getElementById('gameFrame');
  frame.src='../word-scramble-preview/?build='+Date.now();
  frame.addEventListener('load',()=>{
    const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;
    const style=d.createElement('style');
    style.textContent=`
      .slot{overflow:hidden;white-space:nowrap;text-overflow:clip;font-size:1.05rem!important}
      .side{overflow:visible!important;contain:none!important;z-index:20!important}
      .card{z-index:1!important}
      .feedback{top:8px!important;right:0!important;left:auto!important;width:152px!important;max-width:calc(100vw - 26px)!important;padding:10px 11px!important;z-index:40!important;text-align:left!important;overflow:visible!important;box-shadow:0 14px 28px #001020aa!important}
      .feedback b{font-size:.76rem!important;line-height:1.15!important;margin-bottom:3px!important}
      .feedback:not(.bad){background:#075847f6!important;border-color:#70d9ad!important}
      .feedback.bad{background:#5a2430f6!important;border-color:#ef8e8e!important}
      .side:has(.feedback) .bubble{display:none!important}
      .tula{transform-origin:50% 100%!important;will-change:transform,filter,opacity;position:relative!important;z-index:3!important}
      .tula.react-ok{animation:wsTulaCorrect .68s cubic-bezier(.2,.8,.2,1) both!important}
      .tula.react-wrong{animation:wsTulaWrong .58s ease-out both!important}
      .bossSide{padding-top:54px!important;overflow:visible!important;align-items:flex-end!important;z-index:20!important}
      .bossImg{width:138px!important;max-width:160%!important;max-height:330px!important;object-fit:contain!important;object-position:center bottom!important;transform-origin:50% 100%!important;will-change:transform,filter}
      .bossPlate{top:4px!important;left:3px!important;right:-10px!important;z-index:32!important}
      .bossSide .bubble{top:74px!important;left:56px!important;right:auto!important;max-width:110px!important;z-index:31!important}
      .bossFeedback{top:8px!important;right:0!important;left:auto!important;width:154px!important;max-width:calc(100vw - 24px)!important;z-index:42!important;padding:10px!important;box-shadow:0 14px 28px #001020aa!important}
      .bossSide:has(.bossFeedback) .bubble{display:none!important}
      .bossImg.react-hurt{animation:wsBossHurt .65s ease-out both!important}
      .bossImg.react-happy{animation:wsBossHappy .68s cubic-bezier(.2,.8,.2,1) both!important}
      .feedback,.bossFeedback{animation:wsPopup .25s ease-out both!important}
      @keyframes wsTulaCorrect{0%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.055) rotate(2deg);filter:brightness(1.15) saturate(1.12) drop-shadow(0 0 14px #ffe18a)}62%{transform:scale(1.025) rotate(-1deg)}100%{transform:scale(1);filter:brightness(1.04)}}
      @keyframes wsTulaWrong{0%{transform:scale(1)}28%{transform:scale(.985) rotate(-2deg);filter:brightness(.9) saturate(.82)}58%{transform:scale(.99) rotate(2deg)}100%{transform:scale(1);filter:brightness(.98)}}
      @keyframes wsBossHurt{0%{transform:scale(1)}22%{transform:translateY(-5px) scale(.97) rotate(-4deg);filter:brightness(.83) saturate(.75)}48%{transform:translateY(3px) scale(.965) rotate(3deg)}74%{transform:translateY(0) scale(.985) rotate(-2deg)}100%{transform:scale(1);filter:brightness(.96)}}
      @keyframes wsBossHappy{0%{transform:scale(1)}22%{transform:translateY(-9px) scale(1.05) rotate(4deg);filter:brightness(1.12) saturate(1.16)}48%{transform:translateY(0) scale(1.025) rotate(-3deg)}72%{transform:translateY(-6px) scale(1.04) rotate(2deg)}100%{transform:scale(1);filter:brightness(1.03)}}
      @keyframes wsPopup{from{opacity:0;transform:translateY(5px) scale(.96)}to{opacity:1;transform:none}}
      @media(max-width:430px){
        .game{grid-template-columns:minmax(0,1fr) 96px!important}
        .side{width:96px!important}
        .feedback{width:148px!important;right:0!important;top:6px!important}
        .tula{width:108px!important;max-width:124%!important}
        .bossImg{width:124px!important;max-height:295px!important}
        .bossSide{padding-top:50px!important}
        .bossPlate{top:2px!important;font-size:.58rem!important}
        .bossSide .bubble{top:68px!important;left:48px!important;max-width:98px!important;font-size:.48rem!important}
        .bossFeedback{width:148px!important;right:0!important}
      }
      @media(max-width:370px){
        .game{grid-template-columns:minmax(0,1fr) 86px!important}
        .side{width:86px!important}
        .feedback{width:138px!important}
        .bossImg{width:113px!important}
        .bossSide .bubble{left:43px!important;max-width:90px!important}
        .bossFeedback{width:138px!important}
      }
    `;
    d.head.appendChild(style);
    const decorate=()=>{
      let st=null;try{st=w.eval('s')}catch(_){return}if(!st)return;
      d.querySelectorAll('.slot').forEach((el,i)=>{const item=st.sel?.[i];const letter=item&&typeof item==='object'?(item.l??item.letter??''):(item??'');el.textContent=letter;el.classList.toggle('filled',Boolean(letter));});
      const tula=d.querySelector('.tula');if(tula){tula.classList.remove('react-ok','react-wrong');if(st.feedback)tula.classList.add(st.feedback.ok?'react-ok':'react-wrong')}
      const boss=d.querySelector('.bossImg');if(boss){boss.classList.remove('react-hurt','react-happy');if(st.feedback)boss.classList.add(st.feedback.ok?'react-hurt':'react-happy')}
    };
    try{const originalRender=w.render;if(typeof originalRender==='function'){w.render=function(){originalRender();requestAnimationFrame(decorate)}}}catch(_){}
    decorate();
  });
})();
</script>
</body>
</html>
